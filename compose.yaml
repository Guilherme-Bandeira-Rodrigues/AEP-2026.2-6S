name: projetos-sociais

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-aep}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-aep_local_2026}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval 'if (db.adminCommand({ping:1}).ok !== 1) quit(1)'
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_USERNAME:-aep}:${MONGO_PASSWORD:-aep_local_2026}@mongodb:27017/aep?authSource=admin
      FRONTEND_ORIGINS: http://localhost:${WEB_PORT:-3000}
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # Quem chama a API é o navegador, não o container do Next.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8080}/api
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongodb_data:
